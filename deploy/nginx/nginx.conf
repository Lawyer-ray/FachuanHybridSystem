# 法穿公网入口（launchd com.user.fachuan-nginx 托管，homebrew nginx 1.29.x）。
#
# 流量路径：app.xlaw.top → cloudflared 隧道 → 127.0.0.1:5091（本文件）
#   /、/assets/  → 运行时目录 dist 副本（publish.sh 从 frontend/dist 同步）
#   /api/、/social/、/media/ → gunicorn:8003
#
# TCC 约束（设计前提）：macOS 拦截 launchd 后台进程读取 ~/Downloads，
# 因此本配置只引用 __RUNTIME__（install.sh 会替换为
# ~/Library/Application Support/FachuanHybridSystem）下的文件，
# nginx 对仓库（Downloads）零直接读取——媒体文件由 Django 鉴权后
# FileResponse 流式回发（未启用 X-Accel，见 deploy/env/prod.env 注释）。
#
# 只监听 127.0.0.1：外网一律经隧道，不直接暴露端口。
# /admin/ 与 /static/ 未对外暴露（与 vite 代理时代的对外口径一致）；如需
# 手机管理后台，加 location 转发后同步核对 CSRF_TRUSTED_ORIGINS 与 Access 门禁。

worker_processes 2;
pid /opt/homebrew/var/run/nginx-fachuan.pid;
error_log /Users/huangsong21/Library/Logs/fachuan-nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log /Users/huangsong21/Library/Logs/fachuan-nginx-access.log;
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    # 合同 PDF / 扫描件上传上限（对齐后端上传接口口径，宁大勿拦）
    client_max_body_size 200m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    server {
        listen 127.0.0.1:5091;
        server_name app.xlaw.top localhost 127.0.0.1;

        root "__RUNTIME__/dist";
        index index.html;

        # 前端 SPA：静态直出，其余路径兜底 index.html（前端路由）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # vite 构建产物（文件名带 hash）：一年不变缓存
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Django API（含 /api/v1/docs 文档页）
        location /api/ {
            include "__RUNTIME__/nginx/django_proxy.inc";
        }

        # 社交登录（授权页/回调走 Django View，需同源携带 session cookie）。
        # 带尾斜杠做前缀匹配：前端路由 /social-callback 不会被转发（对齐
        # vite 代理 "^/social/" 的写法注释）
        location /social/ {
            include "__RUNTIME__/nginx/django_proxy.inc";
        }

        # 媒体文件：不直出磁盘！经 Django 鉴权（JWT/?token=/session）后由
        # Django FileResponse 流式回发（见 prod.env 里 X-Accel 缓议的说明）
        location /media/ {
            include "__RUNTIME__/nginx/django_proxy.inc";
        }
    }
}
