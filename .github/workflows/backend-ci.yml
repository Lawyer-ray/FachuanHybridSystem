name: backend-ci

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
      - master
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  schedule:
    - cron: "0 2 * * 0"  # 每周日 UTC 2:00（节省 minutes）

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-security-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Security guard (ID/mobile/email/password/token in added lines)
        run: |
          set -euo pipefail
          base=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            base="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "${base}" ]; then
            echo "No base commit found, skipping diff security guard."
            exit 0
          fi
          python3 backend/devtools/security_guard.py \
            --check sensitive \
            --mode range \
            --base "${base}" \
            --head HEAD

  privacy-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: LLM privacy review (requires claude CLI + API key)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if ! command -v claude &>/dev/null || [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "Claude CLI or API key not available, skipping LLM privacy review."
            exit 0
          fi
          base=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            base="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "${base}" ]; then
            echo "No base commit found, skipping LLM privacy review."
            exit 0
          fi
          python3 backend/devtools/privacy_review.py \
            --base "${base}" \
            --head HEAD

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fachuan_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fachuan_ci_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Repository hygiene
        run: |
          set -euo pipefail

          banned=$(git ls-files | grep -E '(^|/)(\.DS_Store|__pycache__/|[^/]+\.pyc)$' || true)
          if [ -n "${banned}" ]; then
            echo "Found banned tracked artifacts:"
            echo "${banned}"
            exit 1
          fi

          env_tracked=$(git ls-files | grep -E '(^|/)\.env(\.[^/]+)?$' | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "${env_tracked}" ]; then
            echo "Found tracked .env files (do not commit secrets):"
            echo "${env_tracked}"
            exit 1
          fi

          media_tracked=$(git ls-files backend/media backend/apiSystem/media 2>/dev/null | grep -v '\.gitkeep$' || true)
          if [ -n "${media_tracked}" ]; then
            echo "Found tracked media artifacts (expected to be runtime-only):"
            echo "${media_tracked}"
            exit 1
          fi

          venv_tracked=$(git ls-files | grep -E '^(backend/)?(\.venv|venv(311|312)?)/' || true)
          if [ -n "${venv_tracked}" ]; then
            echo "Found tracked virtualenv files (do not commit venv):"
            echo "${venv_tracked}"
            exit 1
          fi

          forbidden_binary_in_source=$(git ls-files | grep -Ei '^(backend/(apps|apiSystem|scripts)/|scripts/).*\.(onnx|mp4|zip)$' || true)
          if [ -n "${forbidden_binary_in_source}" ]; then
            echo "Found forbidden binary suffixes in source directories:"
            echo "${forbidden_binary_in_source}"
            echo "Use artifact/object storage instead of tracking these files in Git history."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Cache uv packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile Python
        run: uv run python -m compileall -q apps apiSystem

      - name: Pre-commit (changed files)
        run: |
          set -euo pipefail
          base=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            base="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "${base}" ]; then
            echo "No base commit found, skipping pre-commit changed-files gate."
            exit 0
          fi
          files=()
          while IFS= read -r file; do
            [ -n "${file}" ] && files+=("${file}")
          done < <(git diff --name-only --diff-filter=ACMRT "${base}" HEAD | grep -E '^backend/' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No changed backend files."
            exit 0
          fi
          uv run pre-commit run --files "${files[@]}"

      - name: Lint (ruff, changed files)
        run: |
          set -euo pipefail
          base=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            base="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "${base}" ]; then
            echo "No base commit found, skipping ruff changed-files gate."
            exit 0
          fi
          files=()
          while IFS= read -r file; do
            [ -n "${file}" ] && files+=("${file}")
          done < <(git diff --name-only --diff-filter=ACMRT "${base}" HEAD | grep -E '^backend/apps/.*\.py$' | sed 's|^backend/||' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No changed backend/apps/*.py files."
            exit 0
          fi
          uv run ruff check "${files[@]}" --config ruff.toml

      - name: Lint (ruff, core + apiSystem)
        run: uv run ruff check apps/core apiSystem --config ruff.toml

      - name: Cache mypy
        # mypy 三道门里 full-scan 每次冷启动要全量扫描 40+ app，缓存 .mypy_cache
        # 可复用增量分析结果（mypy 自身按源文件哈希做失效判断）
        uses: actions/cache@v6
        with:
          path: backend/.mypy_cache
          key: mypy-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('backend/uv.lock', 'backend/mypy.ini') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('backend/uv.lock', 'backend/mypy.ini') }}-
            mypy-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Type check (mypy, changed files)
        env:
          PYTHONPATH: "apiSystem:."
          # django-stubs 插件构造时会加载 apiSystem.settings；DJANGO_DEBUG 缺省已
          # 改为 fail-closed（v27.2.7 安全修复），类型检查环境需显式按开发口径加载
          DJANGO_DEBUG: "1"
        run: |
          set -euo pipefail
          base=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            base="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "${base}" ]; then
            echo "No base commit found, skipping mypy changed-files gate."
            exit 0
          fi
          files=()
          while IFS= read -r file; do
            [ -n "${file}" ] && files+=("${file}")
          done < <(git diff --name-only --diff-filter=ACMRT "${base}" HEAD | grep -E '^backend/apps/.*\.py$' | grep -Ev '/__init__\.py$' | sed 's|^backend/||' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No changed backend/apps/*.py files."
            exit 0
          fi
          uv run mypy --config-file=mypy.ini --follow-imports=silent "${files[@]}"

      - name: Type check (mypy, curated gate)
        env:
          PYTHONPATH: "apiSystem:."
          DJANGO_DEBUG: "1"
        run: |
          uv run mypy --config-file=mypy.ini --follow-imports=silent \
            apps/core/services/wiring.py \
            apps/core/protocols/common/__init__.py \
            apps/core/dto/auth.py \
            apps/core/infrastructure/throttling.py \
            apps/core/exceptions/handlers.py \
            apps/core/security/auth.py \
            apps/core/infrastructure/cache.py \
            apps/core/middleware/request_id.py \
            apps/core/middleware/security.py \
            apps/organization/services/auth/auth_service.py \
            apps/organization/services/access/organization_access_policy.py \
            apps/automation/services/wiring.py \
            apiSystem/apiSystem/api.py

      - name: Type check (mypy, full-scan ratchet)
        # 全量 apps 扫描的存量错误棘轮：只许降不许升。
        # 基线按 CI 口径（无私有 plugins 子模块，stub 降级路径生效）：
        # 2026-10-02 实测 69（27 个 plugins 相关文件在降级下的报错 +
        # 16 个判定暂缓项：result_admin 6 / evidence 双域漂移 8 /
        # generation_service 疑似死字段 2）。
        # 2026-10-03：本地口径（含 plugins）已清零（0 错 / 2312 文件 / ~48s），
        # ci-local.sh 与 backend/Makefile 已升级为全量硬门禁；本步骤保留棘轮
        # 是因为 CI 口径（stub 降级）的报错无法在本地复现验证，待一次远端
        # 实测出数后再下调或归零。
        env:
          PYTHONPATH: "apiSystem:."
          DJANGO_DEBUG: "1"
        run: |
          set -euo pipefail
          BASELINE=75
          errors=$(uv run mypy --config-file=mypy.ini apps --no-pretty --no-error-summary 2>/dev/null | grep -c "error:" || true)
          echo "mypy full-scan errors=${errors} baseline=${BASELINE}"
          if [ "${errors}" -gt "${BASELINE}" ]; then
            echo "::error::mypy 全量错误数 ${errors} 超过基线 ${BASELINE}——请修复新增错误，或在大规模清理后下调基线"
            exit 1
          fi
          if [ "${errors}" -lt "${BASELINE}" ]; then
            echo "::notice::mypy 全量错误数已低于基线（${errors} < ${BASELINE}），可将 backend-ci.yml 中的 BASELINE 下调至 ${errors}"
          fi

      - name: Tests (structure, real run)
        env:
          DJANGO_DEBUG: "1"
          DB_ENGINE: "postgresql"
          TEST_DB_ENGINE: "postgresql"
          TEST_DB_NAME: "fachuan_ci_test"
          TEST_DB_USER: "postgres"
          TEST_DB_PASSWORD: "postgres"  # pragma: allowlist secret  # pragma: allowlist secret
          TEST_DB_HOST: "127.0.0.1"
          TEST_DB_PORT: "5432"
          PYTHONPATH: "apiSystem:."
        run: uv run pytest -c pytest.ini --no-cov -q tests/ci/structure/

      - name: Smoke check (minimal)
        env:
          DJANGO_DEBUG: "1"
          DB_ENGINE: "postgresql"
          DB_NAME: "fachuan_ci_test"
          DB_USER: "postgres"
          DB_PASSWORD: "postgres"  # pragma: allowlist secret
          DB_HOST: "127.0.0.1"
          DB_PORT: "5432"
          PYTHONPATH: "apiSystem:."
        run: |
          uv run python apiSystem/manage.py smoke_check \
            --skip-admin \
            --skip-websocket \
            --skip-q

      - name: Dependency audit ignore-list hygiene
        # 豁免棘轮：复评日期过期即 fail，强制清退或续期（约定见 devtools/pip-audit-ignores.txt 头部）
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          expired="$(grep -Ev '^[[:space:]]*(#|$)' devtools/pip-audit-ignores.txt \
            | awk -F' *[|] *' -v t="$today" 'NF>=7 && $5 != "" && $5 < t {print "  " $1 " (" $2 ") 复评日 " $5 " 已过"}' || true)"
          if [ -n "${expired}" ]; then
            echo "::error::以下 pip-audit 豁免已过复评日期，请复评后更新清单（升级删除或续期）："
            echo "${expired}"
            exit 1
          fi
          echo "豁免条目 $(grep -cEv '^[[:space:]]*(#|$)' devtools/pip-audit-ignores.txt) 条，均未过期。"

      - name: Dependency audit (pip-audit)
        run: |
          set -euo pipefail
          ignore_args="$(grep -Ev '^[[:space:]]*(#|$)' devtools/pip-audit-ignores.txt \
            | awk -F' *[|] *' '{printf "--ignore-vuln %s ", $1}')"
          # shellcheck disable=SC2086
          uv run pip-audit ${ignore_args}

      - name: Static security scan (bandit)
        # 2026-10-03：-lll 存量清零后升级为 -ll（MEDIUM 以上全拦）
        run: uv run bandit -r apps -q -ll -x "*/migrations/*,*/static/*,*/staticfiles/*,*/media/*,*/venv*/*,*/htmlcov/*"

  backend-unit-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fachuan_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fachuan_ci_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Cache uv packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Tests (unit + coverage gate)
        env:
          DJANGO_DEBUG: "1"
          DB_ENGINE: "postgresql"
          TEST_DB_ENGINE: "postgresql"
          TEST_DB_NAME: "fachuan_ci_test"
          TEST_DB_USER: "postgres"
          TEST_DB_PASSWORD: "postgres"  # pragma: allowlist secret  # pragma: allowlist secret
          TEST_DB_HOST: "127.0.0.1"
          TEST_DB_PORT: "5432"
          PYTHONPATH: "apiSystem:."
        run: |
          uv run pytest -c pytest.ini \
            -o addopts="--import-mode=importlib -q --tb=short --strict-markers --timeout=60" \
            --capture=fd \
            --reuse-db \
            --cov=apps.cases.services.case.case_admin_export_bridge \
            --cov=apps.cases.services.case.case_contract_export_bridge \
            --cov=apps.contracts.services.contract.admin_workflows.clone_workflow \
            --cov=apps.client.services.text_parser \
            --cov=apps.enterprise_data.services.clients.api_key_pool \
            --cov=apps \
            --cov-report=term-missing --cov-fail-under=78 \
            tests/ci/unit/

  backend-integration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fachuan_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fachuan_ci_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Cache uv packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Tests (integration smoke)
        env:
          DJANGO_DEBUG: "1"
          DB_ENGINE: "postgresql"
          TEST_DB_ENGINE: "postgresql"
          TEST_DB_NAME: "fachuan_ci_test"
          TEST_DB_USER: "postgres"
          TEST_DB_PASSWORD: "postgres"  # pragma: allowlist secret  # pragma: allowlist secret
          TEST_DB_HOST: "127.0.0.1"
          TEST_DB_PORT: "5432"
          PYTHONPATH: "apiSystem:."
        run: uv run pytest -c pytest.ini -o "addopts=--reuse-db --import-mode=importlib -q --tb=short --strict-markers --timeout=60" --no-cov -q tests/ci/integration/

  backend-property-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fachuan_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
        ports:
