      - name: Tests (property smoke)
        env:
          DJANGO_DEBUG: "1"
          DB_ENGINE: "postgresql"
          TEST_DB_ENGINE: "postgresql"
          TEST_DB_NAME: "fachuan_ci_test"
          TEST_DB_USER: "postgres"
          TEST_DB_PASSWORD: "postgres"  # pragma: allowlist secret  # pragma: allowlist secret
          TEST_DB_HOST: "127.0.0.1"
          TEST_DB_PORT: "5432"
          PYTHONPATH: "apiSystem:."
          HYPOTHESIS_PROFILE: "default"
        run: uv run pytest -c pytest.ini --no-cov -q tests/ci/property/

  backend-e2e-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fachuan_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fachuan_ci_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Nightly smoke check
        env:
          DJANGO_DEBUG: "1"
          DB_ENGINE: "postgresql"
          DB_NAME: "fachuan_ci_test"
          DB_USER: "postgres"
          DB_PASSWORD: "postgres"  # pragma: allowlist secret
          DB_HOST: "127.0.0.1"
          DB_PORT: "5432"
          PYTHONPATH: "apiSystem:."
        run: |
          uv run python apiSystem/manage.py smoke_check \
            --skip-websocket \
            --skip-q

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: E2E (Django Admin via Playwright live_server)
        # tests/e2e 此前从未被任何 workflow 执行（仅 smoke_check），本步骤接入。
        # 过渡期先跑 -m smoke 子集（21 用例）观察稳定性，两周后去掉 -m smoke 跑全量 108 例。
        env:
          DJANGO_DEBUG: "1"
          DB_ENGINE: "sqlite"
          DATABASE_PATH: "tests/e2e/e2e_ci.sqlite3"
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"
          PYTHONPATH: "apiSystem:."
        run: |
          uv run pytest -c pytest.ini \
            -o "addopts=--import-mode=importlib -q --tb=short --strict-markers --timeout=180" \
            --no-cov --reuse-db \
            --browser chromium \
            --tracing retain-on-failure \
            -m smoke \
            tests/e2e/

      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-traces
          path: backend/test-results/
          retention-days: 7
