name: frontend-ci

on:
  pull_request:
    paths:
      - 'frontend_2026/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
      - master
      - dev
    paths:
      - 'frontend_2026/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend:
    # frontend_2026 不入库，目录不存在时跳过（避免 workflow 自身变更触发后必然失败）；
    # 未来若目录重新入库，此条件自动恢复生效
    if: hashFiles('frontend_2026/package.json') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend_2026
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend_2026/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend_2026/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc)
        run: pnpm exec tsc --project tsconfig.app.json --noEmit

      - name: Lint (eslint)
        run: pnpm lint

      - name: Build
        run: pnpm build
