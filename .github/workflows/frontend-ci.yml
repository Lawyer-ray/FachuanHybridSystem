name: frontend-ci

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/check-guardrails-wired.mjs'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
      - master
      - dev
    paths:
      - 'frontend/**'
      - 'scripts/check-guardrails-wired.mjs'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 护栏通电自检：先于一切检查跑，防止「写了检查脚本但从不挂进必经链」。
  # 纯 Node、无依赖、秒级返回，作为整条 CI 的冒烟闸门。
  # 背景见 docs/harness/pitfalls.md PIT-001 / PIT-005。
  guardrails-wired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Guardrails wired (check scripts must run somewhere)
        run: node scripts/check-guardrails-wired.mjs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc)
        run: pnpm exec tsc --project tsconfig.app.json --noEmit

      - name: Lint (eslint)
        run: pnpm lint

      - name: Test + coverage (vitest)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
