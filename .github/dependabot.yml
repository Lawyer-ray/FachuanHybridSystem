version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # 分组策略：**不能让「挂了就是大面积故障」的包和大部队挤在一单里**。
    #
    # 背景（2026-11-25 实测）：原来只有一个 `python: patterns: ["*"]`，17 个包打成
    # 一单、+385/−360 行、标题只写 "bump the python group with 14 updates"。
    # `openai` 3.52→3.57 那几行就埋在里面，靠人/靠 AI 逐包拆 diff 才发现。
    # 而 dependabot 的 `uv` 生态是跑 `uv lock --upgrade`，一旦赶上某包发大版本，
    # 大版本升级同样会滑进这一单——CI 还可能是绿的（单测覆盖不到流式帧形状这类变化）。
    #
    # 所以把 critical 组单列出来：它们的 diff 会独立成 PR，标题直接点名，
    # 评审时不会和十几个 patch 级升级混在一起。
    groups:
      critical-backend-deps:
        patterns:
          - "openai"
          - "openai-agents"
          - "deepseek-harness-sdk"
          - "claude-agent-sdk"
          - "google-antigravity"
          - "django"
          - "django-*"
          - "pydantic"
          - "pydantic-core"
          - "opencv-python-headless"
          - "pymupdf"
          - "psycopg"
          - "psycopg-*"
      python:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # ── 前端（pnpm）─────────────────────────────────────────────
  # 为什么必须加这一条（2026-11-26 实测）：上面两条只盯 `/backend` 的 uv 与 workflow
  # 里的 action，`frontend/package.json` + `frontend/pnpm-lock.yaml` **一条都没被盯**。
  # 这不是报错，是静默不做——没人想起来跑 `pnpm update`，前端依赖就永远不升。
  # dependabot 的 `npm` 生态本身吃 pnpm 锁文件（`pnpm-lock.yaml` 在场即可，无需额外配置）。
  #
  # 分组理由与后端 `critical-backend-deps` 同源：改一行就可能整站白屏或让 lint/测试
  # 直接起不来的包单独成单，标题点名、评审不跟十几个 patch 挤在一起；其余打包走。
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      critical-frontend-deps:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@vitejs/plugin-react-swc"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "eslint"
          - "@eslint/*"
          - "tailwindcss"
          - "@tailwindcss/*"
      frontend:
        patterns:
          - "*"
    ignore:
      # TypeScript 大版本必须人工判断，别让机器人当 patch 提，也别让它天天重开：
      # `typescript-eslint@8.74.0` 的 peer 是 `>=4.8.4 <6.1.0`，实测装 TS 7.0.2 后
      # `pnpm lint`（eslint . --max-warnings 0）直接非零退出，`tsc -b` 倒是能过——
      # 也就是说这条红线只有 lint 会拦，很容易被当成"机器人升级没事"放过去。
      # 等 typescript-eslint 放开上界再删这条。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
