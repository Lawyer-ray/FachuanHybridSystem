[project]
name = "fachuan-backend"
version = "26.52.11"
description = "法穿AI Copilot - Backend"
requires-python = ">=3.12"
dependencies = [
    # --- Django 核心 ---
    "django==6.1.0",
    "django-cors-headers==4.9.0",
    "django-nested-admin==4.1.6",
    "django-ninja==1.6.3",
    "django-ninja-jwt==5.4.5",
    "django-ninja-extra==0.31.7",
    "joserfc>=1.7.4",  # CVE-2026-49852
    "django-q2==1.11.1",
    "django-lifecycle==1.3.0",
    # --- ASGI / WebSocket ---
    "uvicorn[standard]==0.52.4",
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "valkey==6.1.1",
    # --- 数据库 ---
    "psycopg[binary]==3.3.4",
    # --- HTTP 客户端 ---
    "httpx[http2]==0.28.1",
    "h2>=4.4.1",
    # --- 异步 I/O ---
    "aiofiles>=24.1.0",
    # --- LLM / AI ---
    "openai>=2.53.0",
    "huggingface_hub>=1.0.0",
    # --- 文档处理 ---
    "docxtpl==0.20.2",
    "python-docx==1.2.0",
    "reportlab==5.0.1",
    "pdfplumber==0.11.10",
    "pikepdf==10.12.0",
    "pymupdf==1.28.2",
    "openpyxl==3.1.5",
    "xlrd>=2.0.1",
    # --- 图像处理 ---
    "opencv-python-headless==5.0.0.93",
    "Pillow==12.3.0",
    # --- OCR ---
    "rapidocr==3.9.2",
    "onnxruntime>=1.28.0",
    "ddddocr>=1.6.0",
    # --- 浏览器自动化 ---
    "playwright==1.62.0",
    "nest-asyncio>=1.6.0",
    "cloakbrowser>=0.5.4",
    # --- 数据处理 ---
    "pandas==3.0.5",
    "pydantic==2.13.4",
    "pydantic-ai>=2.26.0",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    # --- 安全 / 加密 ---
    "cryptography==50.0.1",
    # --- 可观测性 ---
    "psutil==7.2.2",
    "sentry-sdk>=2.66.1",
    "concurrent-log-handler>=0.9.25",
    # --- 配置 ---
    "python-dotenv==1.2.3",
    # --- 热重载 ---
    "watchdog==6.0.0",
    "watchfiles>=1.2.0",
    # --- 生产部署 ---
    "gunicorn==26.2.0",
    "lxml>=6.1.1",
    "mammoth>=1.12.0",
    "markdown>=3.10.3",
    "weasyprint==69.0",
    # --- MCP Server ---
    "mcp[cli]>=1.27.0",
    "gmssl==3.2.2",
    "daphne>=4.2.3",
    "python-multipart==0.0.32",
    "aiohttp>=3.14.3",
    "starlette>=1.3.1",
    # --- 日历同步 ---
    "icalendar>=7.2.2",
    "pyobjc-framework-EventKit>=12.0;sys_platform=='darwin'",
    "django-simple-history>=3.13.0",
    "beautifulsoup4>=4.15.0",
    # --- 云存储 ---
    "webdavclient3>=3.14.7",
    "boto3>=1.43.64",
    "dropbox>=12.2.1",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    "xparse-client>=0.3.0",
]

[dependency-groups]
dev = [
    # --- 代码格式化 ---
    "black==26.5.1",
    "isort==8.0.1",
    "ruff==0.16.5",
    # --- 类型检查 ---
    "mypy==2.3.1",
    "django-stubs==6.1.0",
    "django-stubs-ext==6.1.0",
    "types-python-dateutil",
    "types-requests",
    # --- 安全扫描 ---
    "bandit==1.9.4",
    "detect-secrets==1.5.0",
    "pip-audit==2.10.1",
    # --- Pre-commit ---
    "pre-commit==4.6.2",
]
test = [
    # --- 测试框架 ---
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.5.0",
    # --- Property-Based Testing ---
    "hypothesis==6.165.10",
    # --- 测试工厂 ---
    "factory-boy==3.3.3",
    # --- Temporal workflow 测试 ---
    "temporalio>=1.27.0",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.hypothesis
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*", ".venv/*", ".hypothesis/*"]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/.venv/*",
    "tests/*",
    "*/management/commands/*",
    "*/workflow/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
