[project]
name = "fachuan-backend"
version = "26.52.11"
description = "法穿SI Copilot - Backend"
requires-python = ">=3.12"
dependencies = [
    # --- Django 核心 ---
    "django==6.1.3",
    "django-cors-headers==4.9.0",
    "django-nested-admin==4.1.6",
    "django-ninja==1.8.0",
    "django-ninja-jwt==5.4.5",
    "django-ninja-extra==0.31.7",
    # 运行时补丁：给 ModelForm/ModelAdmin/Field 等加 __class_getitem__，支撑泛型下标写法（生产 --no-dev 也必须安装）
    "django-stubs-ext==6.1.2",
    "joserfc>=1.7.4",  # CVE-2026-49852
    "django-q2==1.11.1",
    "django-lifecycle==1.3.0",
    # --- ASGI / WebSocket ---
    "uvicorn[standard]==0.54.0",
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "valkey==6.2.0",
    # --- 数据库 ---
    "psycopg[binary,pool]==3.3.9",
    # --- HTTP 客户端 ---
    "httpx[http2]==0.28.1",
    "h2>=4.4.1",
    # 同步 HTTP：labor_arbitration 爬虫、法院文书 scraper、WebDAV provider 运行时直用
    "requests>=2.34",
    # --- 异步 I/O ---
    "aiofiles>=24.1.0",
    # --- LLM / AI ---
    # 钉死而不是范围：依赖图里没有任何东西给 openai 设上界（`openai-agents==0.25.0`
    # 只写 `{ name = "openai" }`，无 specifier），所以 `uv lock --upgrade` 可以一路
    # 解析到 4.x。而它是 LLM 网关的唯一 SDK，挂了就是分段/起草/识别/agent 一起挂，
    # 且失败形态多半是流式帧形状变了——单测与 CI 都拦不住。
    # 与同一簇的 openai-agents / deepseek-harness-sdk / claude-agent-sdk 保持一致（都是 `==`）。
    "openai==3.58.0",
    "huggingface-hub>=2.0.0",  # v2 移除 resume_download 参数（本项目未使用，安全）
    # DeepSeek Harness Python SDK：第二个 agent 运行时（与 pi 并存，会话级切换）。
    # 会连带装同版本 deepseek-harness-runtime-bin（平台二进制 wheel）。
    # 锁到 rc 版本：官方明示 developer preview、会有 breaking change，
    # 升级必须走回归（见 docs/04-计划/活跃/dsh-python-sdk-integration.md）。
    "deepseek-harness-sdk==0.2.2rc2",
    # OpenAI Agents SDK：第三个 agent 运行时（与 pi / dsh 并存，会话级切换）。
    # 纯 Python wheel、无平台限制；模型走律所网关的 OpenAI 兼容端点
    # （OpenAIChatCompletionsModel），工具面走共享 MCP（MCPServerStreamableHttp）。
    "openai-agents==0.26.0",
    # Google Antigravity SDK：第四个 agent 运行时（与 pi / dsh / openai-agents 并存，会话级切换）。
    # 纯 Python 包 + **随 wheel 分发的 Go 二进制**（bin/localharness，实测 120MB / 118MB RSS）：
    # 只有 macosx_11_0 / manylinux_2_17 / musllinux_1_1 / win 轮子，别的平台装不上。
    # 模型走律所网关的 OpenAI 兼容端点（但 SDK 不发 auth 头，见 backends/antigravity_gateway.py），
    # 工具面走共享 MCP（McpStreamableHttpServer）。
    # 锁到 0.1.24：官方标 Development Status :: 3 - Alpha，升级必须走回归。
    "google-antigravity==0.1.24",
    # Claude Agent SDK：第五个 agent 运行时（与 pi / dsh / openai-agents / antigravity
    # 并存，会话级切换）。
    #
    # 与其它四个的区别：它说的是 **Anthropic Messages 协议**（`/v1/messages`），
    # 其余四个都走 OpenAI 兼容端点——这正是它在并答里的对照价值。
    # 纯 Python wheel + **随包分发的 `claude` 二进制**（实测 156–170MB），
    # 故只有 macosx / manylinux / musllinux / win 轮子。
    #
    # 锁到 0.2.187（**不能降到 0.2.99**）：两个版本的 mcp 约束不同——
    #   0.2.99  要求 ``mcp>=1.23.0,<2.0.0`` → 与本仓库 ``mcp[cli]>=2.2.0`` 冲突，
    #           ``uv lock`` 直接无解（实测报 "project and mcp[cli]>=2.2.0 are
    #           incompatible"）；
    #   0.2.187 要求 ``mcp>=1.23.0,<3.0.0`` → 兼容。
    # 升级时必须先看它的 ``Requires-Dist: mcp`` 上界，再跑两条判死回归：
    #   ① ``kimi-2.6(Anthropic)`` 经律所网关 ``/v1/messages`` 能回答；
    #   ② ``can_use_tool`` 在高危工具前真阻塞（实测 300s 不超时）且拒绝后工具未执行。
    "claude-agent-sdk==0.2.188",
    # Qoder Agent SDK：第六个 agent 运行时（与 pi / dsh / openai-agents / antigravity /
    # claude-agent 并存，会话级切换）。
    #
    # 与其它五个的区别：它是**唯一自带模型**的后端——默认走 Qoder 云侧模型（这才是
    # 接它的理由：Qoder 会自己迭代、更贴中文/法律场景），而其余五个都落到律所网关。
    # 也支持 BYOK 把网关当直连后端（``FACHUAN_QODER_MODEL_SOURCE=gateway``），但那条
    # 路要 Qoder 账号的 ``allow_byok >= 2``（服务端开关），默认关闭。
    #
    # ⚠️ **依赖冲突：它声明 ``mcp>=1.0.0,<2.0.0``，而本仓库要求 ``mcp[cli]>=2.2.0``。**
    # 处理方式见 ``[tool.uv] override-dependencies``；升级本包时必须重跑
    # ``tests/ci/unit/agent/test_qoder_backend.py::test_sdk_import_surface``（它按名字
    # 钉住 qoder 在 mcp 2.x 上真正用到的那些符号）。
    #
    # 体积代价：wheel 68–99MB（随包分发 165MB 的 ``qodercli`` 二进制），只有
    # macosx / manylinux / musllinux / win 轮子；且**必须能连 Qoder 鉴权**，纯离线部署
    # 用不了（``/agent/backends`` 会如实标不可用）。
    "qoder-agent-sdk==1.0.17",
    # --- 文档处理 ---
    "docxtpl==0.20.2",
    "python-docx==1.2.0",
    "reportlab==5.1.0",
    "pdfplumber==0.11.11",
    "pikepdf==10.18.2",
    "pymupdf==2.1",
    "openpyxl==3.1.5",
    "xlrd>=2.0.1",
    # --- 图像处理 ---
    "opencv-python-headless==5.1.0.95",
    "Pillow==13.0.0",
    # --- OCR ---
    "rapidocr==3.10.0",
    # macOS Vision 本地 OCR（文书识别管线本地档）；Linux/CI 按平台标记跳过
    "pyobjc-framework-Vision>=12.0; sys_platform == 'darwin'",
    "onnxruntime>=1.32.0",
    "ddddocr>=1.6.0",
    # --- 浏览器自动化 ---
    # 仅用原生 Playwright。CloakBrowser（Pro 二进制）首次使用会联网拉包并要求
    # license key，在无终端的 django-q worker/CI 里直接抛错——把「装浏览器」
    # 这个一次性动作变成了任务执行期的授权故障，已移除。
    "playwright==1.65.2",
    # --- 数据处理 ---
    "pandas==3.1.1",
    "pydantic==2.14.4",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.4",
    # --- 安全 / 加密 ---
    "cryptography==50.0.2",
    # --- 可观测性 ---
    "psutil==7.2.2",
    "sentry-sdk>=2.66.1",
    "concurrent-log-handler>=0.9.25",
    # --- 配置 ---
    "python-dotenv==1.2.4",
    # --- 热重载 ---
    "watchfiles>=1.2.0",
    # --- 生产部署 ---
    "gunicorn==27.0.1",
    "lxml>=6.1.1",
    "defusedxml>=0.7.1",
    "mammoth>=1.12.0",
    "markdown>=3.10.3",
    "weasyprint==70.0",
    # --- MCP Server ---
    "mcp[cli]>=2.2.0",
    # mcp 的传递依赖；固定下限避开 CVE-2026-114603（pip-audit 报 1.44.0 命中，修于 1.45.1）
    "opentelemetry-api>=1.45.1",
    "gmssl==3.2.2",
    "python-multipart==0.0.34",
    "aiohttp>=3.14.3",
    "starlette>=1.3.1",
    # --- 日历同步 ---
    "icalendar>=7.2.2",
    "pyobjc-framework-EventKit>=12.0;sys_platform=='darwin'",
    "django-simple-history>=3.13.0",
    "beautifulsoup4>=4.15.0",
    # --- 云存储 ---
    "webdavclient3>=3.14.7",
    "boto3>=1.43.64",
    "dropbox>=12.2.1",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    "xparse-client>=0.3.0",
    "bleach>=6.4.0",
    "webauthn>=3.0.1",
    "authlib>=1.9.1",
    "dnspython>=2.9.0",
    "trafilatura>=2.3",
]

[dependency-groups]
dev = [
    # --- 代码格式化 ---
    "isort==9.0.2",
    "ruff==0.17.6",
    # --- 类型检查 ---
    "mypy==2.4.1",
    "django-stubs==6.1.2",
    "types-python-dateutil",
    "types-requests",
    # --- 安全扫描 ---
    "bandit==1.9.4",
    "detect-secrets==1.5.0",
    "pip-audit==2.10.1",
    # --- Pre-commit ---
    "pre-commit==4.7.0",
]
test = [
    # --- 测试框架 ---
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.5.0",
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
    # --- Property-Based Testing ---
    "hypothesis==6.170.17",
    # --- 测试工厂 ---
    "factory-boy==3.3.3",
    # --- Temporal workflow 测试 ---
    "temporalio>=1.27.0",
    "pytest-playwright>=0.8.0",
]

[tool.uv]
default-groups = ["dev", "test"]
# 传递依赖的安全下限（pip-audit 门禁要求）。
# virtualenv 由 pre-commit 引入（仅开发期用），21.14.9 修了 6 个 CVE（激活脚本
# 命令注入、pyvenv.cfg 行边界注入等）；不约束的话 uv 会锁到 21.13.0。
constraint-dependencies = [
    "virtualenv>=21.14.9",  # pre-commit 引入；修 6 个 CVE（激活脚本注入等）
    "filelock>=4.2.1",      # huggingface-hub / virtualenv 引入；修 3 个 CVE
    "certifi>=2026.10.19",  # HTTPS 根证书包（运行时依赖）；修 PYSEC-2026-4320
]

# 强制覆盖某个包的**上界**——只在「本仓库必须用新版、而某个 SDK 声明了更窄的上界」
# 且已核实「它用到的 API 在新版里都在」时才允许用。
#
# 当前唯一一条：``qoder-agent-sdk==1.0.17`` 声明 ``mcp>=1.0.0,<2.0.0``，与本仓库
# 自己的 MCP 服务（``mcp[cli]>=2.2.0``）直接冲突——不加覆盖 ``uv lock`` 无解。
#
# 为什么可以覆盖（2026-11-27 实测，不是推测）：
#   ① qoder 对 mcp 的**模块级**依赖只有 4 个类型名
#      （``ToolAnnotations`` / ``CallToolRequest`` / ``CallToolRequestParams`` /
#      ``ListToolsRequest``），mcp 2.3.0 上全部存在；
#   ② ``mcp.server.Server`` 只在它建**进程内 SDK MCP server** 时才 import，
#      而法穿只用外部 HTTP MCP（:8011），这条路径永不触达；
#   ③ 上述 ①② 由 ``test_qoder_backend.py::test_sdk_import_surface`` 钉住——
#      mcp 升到删掉这些名字的版本时那条测试当场红，而不是等到真机跑对话。
override-dependencies = [
    "mcp[cli]>=2.2.0",
]

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*", ".venv/*", ".hypothesis/*"]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/.venv/*",
    "tests/*",
    "*/management/commands/*",
    "*/workflow/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
