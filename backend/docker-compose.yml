services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-fachuan_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # 安全审计 E-02：数据库/缓存仅绑回环，禁止发布到所有网卡
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/custom.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fachuan_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: valkey/valkey:8-alpine
    # 安全审计 E-02：设置 REDIS_PASSWORD 时启用 requirepass（生产必须设置）；
    # 未设置时保持无密码，避免破坏既有本地开发流程（端口已绑定 127.0.0.1）。
    command: >-
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
      exec valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD";
      else
      exec valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru;
      fi'
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # 兼容有/无密码两种模式
      test: ["CMD-SHELL", "valkey-cli ping || valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8002:8002"
    volumes:
      - media-data:/app/apiSystem/media
    env_file:
      - .env
    environment:
      DB_ENGINE: ${DB_ENGINE:-postgresql}
      DB_NAME: ${DB_NAME:-fachuan_dev}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      # 复审修正：容器互联走专用变量，避免 backend/.env 的 REDIS_URL（本地直连值）覆盖带密码内网地址
      REDIS_URL: ${APP_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/admin/login/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  qcluster:
    build: .
    entrypoint: ["sh", "-c", "cd /app/apiSystem && uv run python manage.py qcluster"]
    volumes:
      - media-data:/app/apiSystem/media
    env_file:
      - .env
    environment:
      DB_ENGINE: ${DB_ENGINE:-postgresql}
      DB_NAME: ${DB_NAME:-fachuan_dev}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      # 复审修正：容器互联走专用变量，避免 backend/.env 的 REDIS_URL（本地直连值）覆盖带密码内网地址
      REDIS_URL: ${APP_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  media-data:
