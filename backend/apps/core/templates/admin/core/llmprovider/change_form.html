{% extends "admin/change_form.html" %}
{% load i18n %}

{% block extrastyle %}{{ block.super }}
<style>
  #llm-key-editor {
    --llm-line: var(--hairline-color, #e0e0e0);
    --llm-muted: #666;
    --llm-err: #a32d2d;
    --llm-err-bg: #fcebeb;
    --llm-ok: #0f6e56;
    --llm-ok-bg: #e1f5ee;
    --llm-warn: #854f0b;
    --llm-warn-bg: #faeeda;
    font-size: 13px;
  }
  #llm-key-editor .llm-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  #llm-key-editor .llm-toolbar .llm-hint { color: var(--llm-muted); font-size: 12px; }
  #llm-key-editor .llm-spacer { margin-left: auto; }
  #llm-key-editor .llm-key-row { border: 1px solid var(--llm-line); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
  #llm-key-editor .llm-key-row.is-error { border-color: #f09595; }
  #llm-key-editor .llm-row-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  #llm-key-editor .llm-row-index { color: var(--llm-muted); font-size: 12px; }
  #llm-key-editor .llm-row-actions { margin-left: auto; display: flex; gap: 6px; }
  #llm-key-editor .llm-row-actions .button { font-size: 12px; padding: 3px 9px; }
  #llm-key-editor .llm-badge { font-size: 11px; border-radius: 4px; padding: 1px 7px; background: var(--llm-line); color: var(--llm-muted); }
  #llm-key-editor .llm-badge.ok { background: var(--llm-ok-bg); color: var(--llm-ok); }
  #llm-key-editor .llm-badge.err { background: var(--llm-err-bg); color: var(--llm-err); }
  #llm-key-editor .llm-key-input { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; box-sizing: border-box; }
  #llm-key-editor .llm-unlimited { display: inline-flex; align-items: center; gap: 6px; margin: 8px 0; color: var(--llm-muted); font-size: 12px; }
  #llm-key-editor .llm-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 24px; }
  #llm-key-editor .llm-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--llm-line); border-radius: 5px; padding: 1px 7px; }
  #llm-key-editor .llm-chip.warn { background: var(--llm-err-bg); border-color: #f7c1c1; color: var(--llm-err); }
  #llm-key-editor .llm-chip.unknown { border-style: dashed; }
  #llm-key-editor .llm-chip .llm-x { cursor: pointer; color: var(--llm-muted); font-size: 13px; line-height: 1; }
  #llm-key-editor .llm-model-input { font-size: 12px; width: 190px; }
  #llm-key-editor .llm-row-foot { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  #llm-key-editor .llm-row-foot .button { font-size: 12px; padding: 3px 9px; }
  #llm-key-editor .llm-msg { font-size: 12px; color: var(--llm-muted); margin-top: 6px; }
  #llm-key-editor .llm-msg.err { color: var(--llm-err); }
  #llm-key-editor .llm-panel { border: 1px solid var(--llm-line); border-radius: 6px; padding: 10px 12px; margin-top: 12px; }
  #llm-key-editor .llm-panel-title { font-weight: 600; font-size: 12px; margin-bottom: 4px; }
  #llm-key-editor .llm-panel ul { margin: 0; padding-left: 16px; }
  #llm-key-editor .llm-panel li { font-size: 12px; line-height: 1.7; }
  #llm-key-editor li.lvl-error { color: var(--llm-err); }
  #llm-key-editor li.lvl-warn { color: var(--llm-warn); }
  #llm-key-editor li.lvl-ok { color: var(--llm-ok); }
</style>
{% endblock %}

{% block after_field_sets %}{{ block.super }}
<div id="llm-key-editor"
     data-fetch-url="{% if original %}{% url 'admin:core_llmprovider_fetch_models' original.pk %}{% else %}{% url 'admin:core_llmprovider_fetch_models' 'add' %}{% endif %}"></div>
{% endblock %}

{% block extrahead %}{{ block.super }}
<script>
(function () {
    var state = { rows: [], chatProbe: true, rawMode: false };
    var nextId = 1;
    var els = {};
    var ui = {};
    var host = null;
    var area = null;
    var endpoint = "";

    function boot() {
        host = document.getElementById("llm-key-editor");
        if (!host) return;

        area = document.getElementById("id_api_keys");
        if (!area) return;

        endpoint = host.getAttribute("data-fetch-url") || "";
        var formRow = area.closest ? area.closest(".form-row.field-api_keys") : null;
        var fieldset = formRow && formRow.closest ? formRow.closest("fieldset") : null;
        var description = fieldset ? fieldset.querySelector(".description") : null;
        if (description) description.style.display = "none";
        area.style.display = "none";

        if (formRow && area.parentNode) {
            area.parentNode.insertBefore(host, area);
        } else if (formRow) {
            formRow.appendChild(host);
        }
        host.style.flex = "1 1 auto";
        host.style.minWidth = "0";

        buildShell();
        loadFromTextarea();
    }

    function value(id) {
        var node = document.getElementById(id);
        return node ? String(node.value || "").trim() : "";
    }

    function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
    }

    function button(label, className) {
        var node = el("button", "button " + (className || ""), label);
        node.type = "button";
        return node;
    }

    function splitModels(raw) {
        var out = [];
        String(raw || "").replace(/;/g, ",").split(",").forEach(function (part) {
            var model = part.trim();
            if (model && out.indexOf(model) === -1) out.push(model);
        });
        return out;
    }

    function normalizeKey(raw) {
        var key = String(raw || "").trim();
        if (key.toLowerCase().indexOf("bearer ") === 0) key = key.slice(7).trim();
        return key;
    }

    function csrfToken() {
        var node = document.querySelector('input[name="csrfmiddlewaretoken"]');
        return node ? node.value : "";
    }

    function post(payload) {
        return fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": csrfToken() },
            body: JSON.stringify(payload)
        }).then(function (resp) { return resp.json(); });
    }

    function makeRow(key, unlimited, models) {
        return {
            id: nextId++,
            key: key || "",
            unlimited: unlimited !== false,
            models: models || [],
            probe: null,
            chat: []
        };
    }

    function parseRows() {
        var rows = [];
        String(area.value || "").split("\n").forEach(function (line) {
            var text = line.trim();
            if (!text) return;
            var sep = text.indexOf("|");
            if (sep !== -1) {
                rows.push(makeRow(normalizeKey(text.slice(0, sep)), false, splitModels(text.slice(sep + 1))));
                return;
            }
            text.replace(/;/g, ",").split(",").forEach(function (segment) {
                var key = normalizeKey(segment);
                if (key) rows.push(makeRow(key, true, []));
            });
        });
        return rows;
    }

    function serialize() {
        var lines = [];
        state.rows.forEach(function (row) {
            var key = normalizeKey(row.key);
            if (!key) return;
            if (row.unlimited || !row.models.length) {
                lines.push(key);
                return;
            }
            lines.push(key + "|" + row.models.join(","));
        });
        area.value = lines.join("\n");
    }

    function setGlobalStatus(text, isError) {
        if (!ui.globalStatus) return;
        ui.globalStatus.textContent = text || "";
        ui.globalStatus.style.color = isError ? "var(--llm-err)" : "var(--llm-muted)";
    }

    function setRowMessage(row, text, isError) {
        var ref = els[row.id];
        if (!ref) return;
        ref.message.textContent = text || "";
        ref.message.className = isError ? "llm-msg err" : "llm-msg";
    }

    function renderBadge(row) {
        var badge = els[row.id].badge;
        var probe = row.probe;
        if (!probe) {
            badge.className = "llm-badge";
            badge.textContent = "未获取模型";
            return;
        }
        if (probe.ok) {
            badge.className = "llm-badge ok";
            badge.textContent = "已获取 " + probe.models.length + " 个模型";
            return;
        }
        badge.className = "llm-badge err";
        badge.textContent = "获取失败 · " + (probe.error || "未知错误");
    }

    function isNonChat(row, model) {
        if (!row.probe || !row.probe.ok || !row.chat.length) return false;
        if (row.probe.models.indexOf(model) === -1) return false;
        return row.chat.indexOf(model) === -1;
    }

    function renderChips(row) {
        var box = els[row.id].chips;
        box.textContent = "";
        if (!row.models.length) {
            box.appendChild(el("span", "llm-msg", "未选择模型 —— 该 Key 将按「不限模型」保存"));
            return;
        }
        row.models.forEach(function (model) {
            var className = "llm-chip";
            if (row.probe && row.probe.ok && row.probe.models.indexOf(model) === -1) {
                className = "llm-chip unknown";
            } else if (isNonChat(row, model)) {
                className = "llm-chip warn";
            }
            var chip = el("span", className);
            chip.appendChild(el("span", null, isNonChat(row, model) ? model + " 不支持对话" : model));
            var remove = el("span", "llm-x", "\u00d7");
            remove.title = "移除该模型";
            remove.addEventListener("click", function () {
                row.models = row.models.filter(function (item) { return item !== model; });
                sync();
            });
            chip.appendChild(remove);
            box.appendChild(chip);
        });
    }

    function renderRow(row) {
        var ref = els[row.id];
        ref.index.textContent = "Key #" + (state.rows.indexOf(row) + 1);
        ref.root.className = row.probe && !row.probe.ok ? "llm-key-row is-error" : "llm-key-row";
        ref.unlimited.checked = row.unlimited;
        ref.models.style.display = row.unlimited ? "none" : "";
        if (row.chat.length) {
            ref.selectChat.style.display = "";
            ref.selectChat.textContent = "选择全部对话模型（" + row.chat.length + "）";
        } else {
            ref.selectChat.style.display = "none";
        }
        renderBadge(row);
        renderChips(row);
    }

    function sync() {
        serialize();
        state.rows.forEach(renderRow);
        validate();
    }

    function addModel(row, raw) {
        var model = String(raw || "").trim();
        if (!model) return;
        if (row.models.indexOf(model) === -1) row.models.push(model);
        row.unlimited = false;
        sync();
    }

    function loadFromTextarea() {
        state.rows = parseRows();
        if (!state.rows.length) state.rows.push(makeRow("", true, []));
        renderAll();
    }

    function renderAll() {
        els = {};
        ui.body.textContent = "";
        state.rows.forEach(function (row) {
            ui.body.appendChild(buildRow(row));
        });
        sync();
    }

    function buildRow(row) {
        var root = el("div", "llm-key-row");

        var head = el("div", "llm-row-head");
        var index = el("span", "llm-row-index");
        var badge = el("span", "llm-badge");
        var actions = el("span", "llm-row-actions");
        var fetchBtn = button("获取模型", "llm-btn-fetch");
        var copyBtn = button("复制", "llm-btn-copy");
        var removeBtn = button("删除", "llm-btn-remove");
        actions.appendChild(fetchBtn);
        actions.appendChild(copyBtn);
        actions.appendChild(removeBtn);
        head.appendChild(index);
        head.appendChild(badge);
        head.appendChild(actions);

        var keyInput = document.createElement("input");
        keyInput.type = "text";
        keyInput.className = "llm-key-input";
        keyInput.autocomplete = "off";
        keyInput.spellcheck = false;
        keyInput.placeholder = "sk-...（可粘贴多行，自动拆分）";
        keyInput.value = row.key;

        var unlimitedLabel = el("label", "llm-unlimited");
        var unlimitedBox = document.createElement("input");
        unlimitedBox.type = "checkbox";
        unlimitedLabel.appendChild(unlimitedBox);
        unlimitedLabel.appendChild(el("span", null, "不限模型（该 Key 可用于本平台任意模型）"));

        var models = el("div", "llm-models");
        var chips = el("div", "llm-chips");
        var foot = el("div", "llm-row-foot");
        var modelInput = document.createElement("input");
        modelInput.type = "text";
        modelInput.className = "llm-model-input";
        modelInput.setAttribute("list", "llm-model-pool");
        modelInput.autocomplete = "off";
        modelInput.placeholder = "输入模型名后回车添加";
        var selectChat = button("选择全部对话模型", "llm-btn-select-chat");
        var clearBtn = button("清空", "llm-btn-clear");
        foot.appendChild(modelInput);
        foot.appendChild(selectChat);
        foot.appendChild(clearBtn);
        models.appendChild(chips);
        models.appendChild(foot);

        var message = el("div", "llm-msg");

        root.appendChild(head);
        root.appendChild(keyInput);
        root.appendChild(unlimitedLabel);
        root.appendChild(models);
        root.appendChild(message);

        keyInput.addEventListener("input", function () {
            row.key = keyInput.value;
            serialize();
            validate();
        });
        keyInput.addEventListener("paste", function (event) {
            var clipboard = event.clipboardData || window.clipboardData;
            if (!clipboard) return;
            var raw = clipboard.getData("text");
            if (!raw || raw.indexOf("\n") === -1) return;
            event.preventDefault();
            expandPastedKeys(row, raw);
        });
        unlimitedBox.addEventListener("change", function () {
            row.unlimited = unlimitedBox.checked;
            if (!row.unlimited && !row.models.length && row.chat.length) {
                row.models = row.chat.slice();
            }
            sync();
        });
        modelInput.addEventListener("keydown", function (event) {
            if (event.key !== "Enter" && event.key !== ",") return;
            event.preventDefault();
            addModel(row, modelInput.value);
            modelInput.value = "";
        });
        modelInput.addEventListener("change", function () {
            if (!modelInput.value) return;
            addModel(row, modelInput.value);
            modelInput.value = "";
        });
        fetchBtn.addEventListener("click", function () { fetchOne(row, fetchBtn); });
        copyBtn.addEventListener("click", function () {
            state.rows.splice(state.rows.indexOf(row) + 1, 0, makeRow(row.key, row.unlimited, row.models.slice()));
            renderAll();
        });
        removeBtn.addEventListener("click", function () {
            state.rows = state.rows.filter(function (item) { return item !== row; });
            if (!state.rows.length) state.rows.push(makeRow("", true, []));
            renderAll();
        });
        selectChat.addEventListener("click", function () {
            row.models = row.chat.slice();
            row.unlimited = false;
            sync();
        });
        clearBtn.addEventListener("click", function () {
            row.models = [];
            sync();
        });

        els[row.id] = {
            root: root,
            index: index,
            badge: badge,
            chips: chips,
            unlimited: unlimitedBox,
            models: models,
            message: message,
            selectChat: selectChat
        };
        return root;
    }

    function expandPastedKeys(row, raw) {
        var parsed = [];
        raw.split("\n").forEach(function (line) {
            var text = line.trim();
            if (!text) return;
            text.replace(/;/g, ",").split(",").forEach(function (segment) {
                var key = normalizeKey(segment);
                if (key) parsed.push(key);
            });
        });
        if (!parsed.length) return;
        row.key = parsed[0];
        var at = state.rows.indexOf(row) + 1;
        parsed.slice(1).reverse().forEach(function (key) {
            state.rows.splice(at, 0, makeRow(key, true, []));
        });
        renderAll();
        setGlobalStatus("已从粘贴内容拆出 " + parsed.length + " 行 Key", false);
    }

    function applyProbe(row, data) {
        var perKey = (data && data.per_key) || [];
        var item = perKey[0] || null;
        if (!item || !item.ok) {
            row.probe = {
                ok: false,
                models: [],
                error: (item && item.error) || (data && data.error) || "未知错误"
            };
            row.chat = [];
            return "";
        }
        row.probe = { ok: true, models: item.models || [], error: "" };
        row.chat = data.chat_models || [];
        mergeModelPool(item.models || []);
        if (row.unlimited) return "";
        var keep = row.models.filter(function (model) {
            return row.probe.models.indexOf(model) !== -1;
        });
        var removed = row.models.length - keep.length;
        row.models = keep;
        if (!removed) return "";
        return "有 " + removed + " 个已选模型不在该 Key 的授权列表内，已自动移除。";
    }

    function fetchOne(row, trigger) {
        var key = normalizeKey(row.key);
        if (!key) { setRowMessage(row, "请先填写 Key", true); return; }
        var baseUrl = value("id_base_url");
        if (!baseUrl) { setRowMessage(row, "请先填写 API 地址", true); return; }

        if (trigger) trigger.disabled = true;
        setRowMessage(row, "正在获取模型…" + (state.chatProbe ? "（含对话能力探测，可能需要十几秒）" : ""), false);
        post({ base_url: baseUrl, api_keys: key, probe_chat: state.chatProbe })
            .then(function (data) {
                var note = applyProbe(row, data);
                setRowMessage(row, note, !!note);
                sync();
            })
            .catch(function () {
                setRowMessage(row, "获取失败：网络或服务异常", true);
            })
            .then(function () {
                if (trigger) trigger.disabled = false;
            });
    }

    function fetchAll() {
        var targets = state.rows.filter(function (row) { return normalizeKey(row.key); });
        if (!targets.length) { setGlobalStatus("请先填写至少一个 Key", true); return; }
        var baseUrl = value("id_base_url");
        if (!baseUrl) { setGlobalStatus("请先填写 API 地址", true); return; }

        state.rows.forEach(function (row) { setRowMessage(row, "", false); });
        setGlobalStatus("正在逐个 Key 获取模型…" + (state.chatProbe ? "（含对话能力探测，耗时较长）" : ""), false);

        var joined = targets.map(function (row) { return normalizeKey(row.key); }).join("\n");
        post({ base_url: baseUrl, api_keys: joined, probe_chat: state.chatProbe })
            .then(function (data) {
                var perKey = (data && data.per_key) || [];
                targets.forEach(function (row, position) {
                    var note = applyProbe(row, {
                        per_key: perKey[position] ? [perKey[position]] : [],
                        chat_models: data.chat_models || [],
                        error: data.error
                    });
                    if (note) setRowMessage(row, note, true);
                });
                sync();
                var okCount = targets.filter(function (row) { return row.probe && row.probe.ok; }).length;
                setGlobalStatus("完成：" + okCount + " / " + targets.length + " 个 Key 获取成功", okCount !== targets.length);
            })
            .catch(function () { setGlobalStatus("获取失败：网络或服务异常", true); });
    }

    function mergeModelPool(models) {
        var pool = document.getElementById("llm-model-pool");
        if (!pool) return;
        var known = {};
        Array.prototype.forEach.call(pool.options, function (option) { known[option.value] = true; });
        models.forEach(function (model) {
            if (known[model]) return;
            known[model] = true;
            var option = document.createElement("option");
            option.value = model;
            pool.appendChild(option);
        });
    }

    function writeExtraModels() {
        var target = document.getElementById("id_extra_models");
        if (!target) { setGlobalStatus("找不到「模型列表」字段", true); return; }

        var union = [];
        state.rows.forEach(function (row) {
            row.models.forEach(function (model) {
                if (union.indexOf(model) === -1) union.push(model);
            });
        });
        if (!union.length) { setGlobalStatus("各行均未选择具体模型，无可写入内容", true); return; }

        var nonChat = {};
        state.rows.forEach(function (row) {
            row.models.forEach(function (model) {
                if (isNonChat(row, model)) nonChat[model] = true;
            });
        });

        var kept = union.filter(function (model) { return !nonChat[model]; });
        var merged = splitModels(String(target.value || "").replace(/\n/g, ","));
        kept.forEach(function (model) {
            if (merged.indexOf(model) === -1) merged.push(model);
        });
        target.value = merged.join(",");
        var skipped = union.length - kept.length;
        setGlobalStatus("已写入模型列表：" + kept.length + " 个" + (skipped ? "（跳过 " + skipped + " 个非对话模型）" : ""), false);
    }

    function validate() {
        var items = [];
        var keyed = state.rows.filter(function (row) { return normalizeKey(row.key); });

        var seen = {};
        var duplicates = [];
        keyed.forEach(function (row) {
            var key = normalizeKey(row.key);
            if (seen[key]) {
                if (duplicates.indexOf(key) === -1) duplicates.push(key);
                return;
            }
            seen[key] = true;
        });
        if (duplicates.length) {
            items.push({ level: "error", text: "有 " + duplicates.length + " 个 Key 重复，保存后重复行会被自动去重丢弃。" });
        }

        var blank = state.rows.length - keyed.length;
        if (blank > 0) {
            items.push({ level: "warn", text: "有 " + blank + " 行未填写 Key，保存时会被忽略。" });
        }

        var unscoped = keyed.filter(function (row) { return !row.unlimited && !row.models.length; });
        if (unscoped.length) {
            items.push({ level: "warn", text: "有 " + unscoped.length + " 行未选择模型，将按「不限模型」保存。" });
        }

        var failed = state.rows.filter(function (row) { return row.probe && !row.probe.ok; });
        if (failed.length) {
            items.push({ level: "warn", text: "有 " + failed.length + " 个 Key 获取模型失败，其模型白名单未更新。" });
        }

        var defaultModel = value("id_default_model");
        if (defaultModel && keyed.length) {
            var covering = keyed.filter(function (row) {
                return row.unlimited || row.models.indexOf(defaultModel) !== -1;
            });
            if (covering.length) {
                items.push({ level: "ok", text: "默认模型 " + defaultModel + " 由 " + covering.length + " 个 Key 覆盖。" });
            } else {
                items.push({
                    level: "error",
                    text: "默认模型 " + defaultModel + " 未被任何 Key 授权，运行时可能返回 403 key not allowed to access model。"
                });
            }
        }

        ui.panel.textContent = "";
        if (!items.length) { ui.panel.style.display = "none"; return; }
        ui.panel.style.display = "";
        ui.panel.appendChild(el("div", "llm-panel-title", "保存前校验（" + items.length + " 项）"));
        var list = document.createElement("ul");
        items.forEach(function (item) {
            list.appendChild(el("li", "lvl-" + item.level, item.text));
        });
        ui.panel.appendChild(list);
    }

    function buildShell() {
        var toolbar = el("div", "llm-toolbar");
        var addBtn = button("+ 新增 Key 行", "llm-btn-add");
        var fetchAllBtn = button("全部获取模型", "llm-btn-fetch-all");
        var writeBtn = button("把各行模型并集写入「模型列表」", "llm-btn-write-models");
        var spacer = el("span", "llm-spacer");
        var probeLabel = el("label", "llm-hint");
        var probeBox = document.createElement("input");
        probeBox.type = "checkbox";
        probeBox.checked = true;
        probeLabel.appendChild(probeBox);
        probeLabel.appendChild(el("span", null, "获取时探测对话能力（较慢）"));
        var rawBtn = button("原始文本模式", "llm-btn-raw");
        var globalStatus = el("span", "llm-hint");

        spacer.appendChild(probeLabel);
        toolbar.appendChild(addBtn);
        toolbar.appendChild(fetchAllBtn);
        toolbar.appendChild(writeBtn);
        toolbar.appendChild(spacer);
        toolbar.appendChild(rawBtn);

        var body = el("div", "llm-body");
        var panel = el("div", "llm-panel");
        panel.style.display = "none";

        var pool = document.createElement("datalist");
        pool.id = "llm-model-pool";

        host.appendChild(toolbar);
        host.appendChild(body);
        host.appendChild(globalStatus);
        host.appendChild(panel);
        host.appendChild(pool);

        ui.body = body;
        ui.panel = panel;
        ui.globalStatus = globalStatus;
        ui.rawBtn = rawBtn;

        addBtn.addEventListener("click", function () {
            state.rows.push(makeRow("", true, []));
            renderAll();
        });
        fetchAllBtn.addEventListener("click", fetchAll);
        writeBtn.addEventListener("click", writeExtraModels);
        probeBox.addEventListener("change", function () {
            state.chatProbe = probeBox.checked;
        });
        rawBtn.addEventListener("click", function () { setRawMode(!state.rawMode); });

        var defaultModel = document.getElementById("id_default_model");
        if (defaultModel) defaultModel.addEventListener("input", validate);
    }

    function setRawMode(on) {
        state.rawMode = on;
        serialize();
        ui.body.style.display = on ? "none" : "";
        ui.panel.style.display = on ? "none" : ui.panel.style.display;
        ui.rawBtn.textContent = on ? "返回可视化编辑" : "原始文本模式";
        area.style.display = on ? "" : "none";
        if (on) return;
        loadFromTextarea();
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
    } else {
        boot();
    }
})();
</script>
{% endblock %}
