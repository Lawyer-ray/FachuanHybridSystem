[pytest]
django_find_project = false
DJANGO_SETTINGS_MODULE = apiSystem.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Test
python_functions = test_*
# addopts 默认值刻意保持「单进程、不建库复用的显式选择」：
#
# - 不放 -n / --dist：xdist 下 pytest-django 按 worker 派生 test_..._gw0/_gw1
#   测试库，两个 worker 冷启动时各建一遍（各跑 447 个迁移），既慢又互相抢，
#   正是「冷启动必然超时」的放大器之一。需要并行时显式加
#   `-n auto --dist loadscope`（库已建好之后再并行最划算）。
# - 不放 --reuse-db：默认复用会让「schema 已改、库未重建」跑出假绿。需要快速
#   重跑时显式 `--reuse-db`；要重建时 `--create-db`（覆盖 --reuse-db）。
#
# timeout 放在 ini 里（而不是 addopts），这样命令行显式 `--timeout=` 仍可覆盖。
# timeout_func_only=True 是修复核心：pytest-timeout 默认 funconly=False，计时
# **包含 fixture setup**，而建库（django_db_setup / create_test_db，447 个迁移
# 实测冷启动 ~45s）就发生在第一个用例的 setup 里，于是 30s 一刀切把建库也算了
# 进去——表现为每条用例 ERROR + `Failed: Timeout (>30.0s)`。
# func_only=True 只给**用例主体**计时，建库/迁移不再受限；30s 仍然是「线程
# 写库未提交导致 flush 卡住」这类真实竞态的哨兵（见 conftest.py 里
# `_sync_first_user_setup_deferred_init` 的注释），没有被削弱。
addopts =
    --import-mode=importlib
    -q
    --tb=short
    --strict-markers
timeout = 30
timeout_func_only = True
# 覆盖率门禁仅在 CI workflow 中配置，默认入口指向可追踪的 CI 测试树。
testpaths = tests/ci
pythonpath = apiSystem .
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    anyio: marks tests as anyio async tests
    asyncio: marks tests as asyncio tests
    property: marks tests as property-based tests
    property_test: marks tests as property-based tests (alias)
    smoke: marks tests as admin/e2e smoke (nightly subset entry)
    crud: marks tests as CRUD flow tests (tests/e2e)
