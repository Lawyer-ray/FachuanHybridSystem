# Pre-commit hooks for code quality
# Install: uv tool install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^.*\.(md|rst)$
      - id: end-of-file-fixer
        exclude: ^.*\.(md|rst)$
      - id: check-yaml
        # pnpm 12 的 lockfile 为多文档 YAML（前置块记录 pnpm 自身二进制版本映射）
        exclude: ^frontend/pnpm-lock\.yaml$
      - id: check-added-large-files
        args: ['--maxkb=1000']
        # openapi.json 是 export_openapi_schema 的生成物快照（约 1.1MB），
        # 内容经 detect-secrets 与隐私扫描，不属于意外提交的大文件
        exclude: ^backend/\.secrets\.baseline$|^backend/openapi\.json$
      - id: check-json
        exclude: ^frontend_2026/tsconfig\.(app|node)\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=120']
        exclude: ^.*/(migrations|\.venv)/.*$

  # Linting (ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check
        args: ['--config=backend/ruff.toml', '--fix']
        files: ^backend/(apps|apiSystem)/.*\.py$
        exclude: ^.*/(migrations|\.venv)/.*$
      - id: ruff-format
        args: ['--config=backend/ruff.toml']
        files: ^backend/(apps|apiSystem)/.*\.py$
        exclude: ^.*/(migrations|\.venv)/.*$

  # Type checking (handled by dedicated CI job, skip in pre-commit to avoid env issues)
  # - repo: local
  #   hooks:
  #     - id: mypy

  # Secrets scanning
  #
  # 不要改回 `repo: Yelp/detect-secrets` + `args: ['--baseline', ...]`：
  # v1.5.0 的 detect-secrets-hook 会**原地写回**基线（trim 掉这一遍扫描没复现出的条目，
  # 退出码 3），一次普通提交就能把 backend/.secrets.baseline 从 ~2879 行削到 ~146 行
  # （"results": {}），历史豁免全部失效、之后每次提交都被误报挡住。
  # 上游没有 --no-write/--dry-run 开关，只读语义只能由这层封装提供（基线在临时副本上读写）。
  # 复盘与自检：docs/harness/backend/infra.md「detect-secrets 把基线整份清空」
  - repo: local
    hooks:
      - id: detect-secrets
        name: Detect secrets (baseline read-only)
        description: 用 detect-secrets 扫暂存文件；基线只读（临时副本），永不被钩子改写。
        entry: python scripts/detect_secrets_readonly.py
        language: python
        additional_dependencies: ['detect-secrets==1.5.0']
        types: [file]
        exclude: ^.*/(logs|htmlcov|media|migrations|staticfiles|\.venv)/.*$|^backend/\.secrets\.baseline$|frontend/pnpm-lock\.yaml$

  - repo: local
    hooks:
      - id: forbid-added-todo-markers
        name: Forbid added TODO markers
        entry: python backend/devtools/security_guard.py --check todo --mode staged
        language: python
        types: [python]

      - id: forbid-new-broad-except
        name: Forbid new broad except Exception
        description: 新增宽异常捕获必须同时删掉一条（全仓棘轮只许下调，不许上调）。
        entry: python backend/devtools/security_guard.py --check broad-except --mode staged
        language: python
        types: [python]

      - id: forbid-added-print
        name: Forbid added print/pprint
        entry: python backend/devtools/security_guard.py --check print --mode staged
        language: python
        types: [python]

      - id: forbid-source-binary-artifacts
        name: Forbid source binary artifacts (.onnx/.mp4/.zip)
        entry: python backend/devtools/security_guard.py --check binary-ext --mode staged
        language: python
        pass_filenames: false

      - id: forbid-weike-private-paths
        name: Forbid committing weike private implementation paths
        entry: python backend/devtools/security_guard.py --check private-path --mode staged
        language: python
        pass_filenames: false

      - id: forbid-sensitive-patterns
        # 隐私全库扫（姓名/案名/公司/证件号/电话/案号/地址，含 changelog/docs/前端/测试）；
        # 凭证类只盯源码目录；假数据在行尾加 privacy-allow 标记放行；`--mode all` 可全量审计
        name: Forbid privacy/sensitive patterns (name/case/company/ID/phone/case-no/address/token)
        entry: python backend/devtools/security_guard.py --check sensitive --mode staged
        language: python
        files: .*

      - id: llm-privacy-guard
        # 大模型复审正则盲区（孤立人名 / 无后缀机构名 / 门牌地址）：含中文的新增行分片并发送审，
        # 槽位 = Σ(每 key 并发 × key 数) 吃满多 key 配额；模型不可达 / 无 venv 一律放行并提示。
        # FACHUAN_LLM_PRIVACY=off 可临时关闭
        name: LLM privacy review (names/orgs/addresses beyond regex; skips when model unreachable)
        entry: backend/devtools/llm_privacy_hook.sh
        language: script
        files: .*
        pass_filenames: false
        verbose: true

      - id: check-secrets-baseline-shrink
        # 兜底护栏（必须排在所有会改文件的钩子之后）：backend/.secrets.baseline 被净删 >100 行
        # 或 "results" 被清空 → 立刻失败并给还原命令。主修法见 detect-secrets 钩子的注释。
        name: Guard backend/.secrets.baseline against bulk deletion
        # language: script 的 entry 第一段会被当成「仓库内路径」解析，不能写 `bash ...`
        entry: scripts/check-secrets-baseline-shrink.sh
        language: script
        files: .*
        pass_filenames: false
        always_run: true
