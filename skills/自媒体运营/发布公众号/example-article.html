<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>示例文章</title>
<style>
body { font-family: "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif; line-height: 1.8; max-width: 680px; margin: 0 auto; padding: 20px; color: #333; }
h1 { font-size: 22px; font-weight: bold; margin-bottom: 16px; }
h2 { font-size: 18px; font-weight: bold; margin-top: 24px; margin-bottom: 12px; }
p { margin: 12px 0; text-align: justify; }
blockquote { border-left: 4px solid #e0e0e0; padding-left: 16px; color: #666; margin: 16px 0; }
strong { font-weight: bold; }
</style>
</head>
<body>
<h1>这是文章标题</h1>
<p>这是一篇示范用微信公众号草稿文章。</p>
<p>你可以把真实内容写成 HTML，也可以直接传纯文本（脚本会自动包装成基础 HTML 格式）。</p>
<h2>小标题</h2>
<p>正文内容……</p>
<blockquote>
<p>引用块示例。</p>
</blockquote>
<p><strong>加粗文字示例。</strong></p>
</body>
</html>
